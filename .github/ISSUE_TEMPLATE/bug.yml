name: Bug report
description: 报告可复现的运行、状态、恢复或文档问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请勿上传未公开正文、私人数据或凭据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 0.4.0-beta
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、PowerShell、Codex 界面与已安装 Skill。
    validations:
      required: true

