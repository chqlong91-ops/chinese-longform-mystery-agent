name: Feature request
description: 提议新的通用能力或产品化改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 非目标与边界
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: 是否可能触发三级例外
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true

